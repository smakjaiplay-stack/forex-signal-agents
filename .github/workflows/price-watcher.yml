name: Price Watcher (Every 15 min)

on:
  schedule:
    # Every 15 min during forex trading days, on odd minutes to dodge the
    # top-of-hour queue on GitHub's shared scheduler.
    - cron: "4,19,34,49 * * * 1-5"
    # Sunday 21:00-23:59 UTC — the Asia open, before Monday UTC starts.
    - cron: "4,19,34,49 21-23 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write   # needed to commit the updated open_trade.json back to the repo

concurrency:
  # A delayed run must not overlap the next one — both write open_trade.json.
  group: price-watcher
  cancel-in-progress: false

jobs:
  watch-price:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip   # this job runs ~96x/day — the cache matters for the minutes bill

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Agent 5 - Price Watcher
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: python agent5_price_watcher.py

      - name: Commit updated trade state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -f open_trade.json ]; then
            echo "open_trade.json not found; nothing to commit."
            exit 0
          fi
          git add open_trade.json
          [ -f trades_log.jsonl ] && git add trades_log.jsonl
          git diff --staged --quiet && exit 0
          git commit -m "Update trade state [skip ci]"
          # The signal pipeline pushes to this branch too — rebase, don't fail.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push attempt $i failed, retrying..."
            sleep 5
          done
          exit 1
